# Render Blueprint for MedControl Backend
services:
  - type: web
    name: medcontrol-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: medcontrol_prod
      - key: JWT_SECRET
        generateValue: true
      # Remitente de los correos (Resend). Formato "Nombre <correo>"; el
      # dominio dosaria.org debe estar verificado en Resend.
      - key: EMAIL_FROM
        value: Dosaria <soporte@dosaria.org>
      # RESEND_API_KEY: clave de la API de Resend (plan gratuito: 3.000
      # correos/mes, 100/dia). Es secreto: se gestiona solo en el dashboard
      # de Render, nunca en este blueprint.
      - key: RESEND_API_KEY
        sync: false
