# Render Blueprint for MedControl Backend
services:
  - type: web
    name: medcontrol-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: medcontrol_prod
      - key: JWT_SECRET
        generateValue: true
      # Remitente de los correos (SendGrid Single Sender verificado).
      # NOTA: debe estar verificado en SendGrid antes de que envie.
      - key: SENDGRID_FROM_EMAIL
        value: soporte@dosaria.org
      # SENDGRID_API_KEY es secreto: se gestiona solo en el dashboard de Render (no en este blueprint).
